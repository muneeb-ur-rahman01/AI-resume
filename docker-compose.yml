# Local development stack. NOT a production deployment (see docs/DEPLOYMENT.md).
name: careerpilot

x-api-env: &api-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@postgres:5432/careerpilot
  REDIS_URL: redis://redis:6379/0
  TASK_MODE: celery
  FRONTEND_URL: http://localhost:3000
  CORS_ORIGINS: '["http://localhost:3000"]'
  SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  STORAGE_PROVIDER: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: careerpilot-private
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-careerpilot}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-careerpilot-dev-secret}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: careerpilot
      POSTGRES_PASSWORD: careerpilot
      POSTGRES_DB: careerpilot
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerpilot -d careerpilot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-careerpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-careerpilot-dev-secret}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/careerpilot-private &&
        mc anonymous set none local/careerpilot-private
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-careerpilot}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-careerpilot-dev-secret}
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]  # web UI + SMTP for captured development email
    restart: unless-stopped

  migrate:
    build: {context: ./services/api, dockerfile: Dockerfile}
    command: ["sh", "-c", "alembic upgrade head && python -m careerpilot.cli seed-skills"]
    environment: *api-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build: {context: ./services/api, dockerfile: Dockerfile}
    environment: *api-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: {context: ./services/api, dockerfile: Dockerfile}
    command: ["celery", "-A", "careerpilot.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    stop_grace_period: 60s
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args: {API_INTERNAL_URL: "http://api:8000"}  # rewrites are resolved at build time
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
