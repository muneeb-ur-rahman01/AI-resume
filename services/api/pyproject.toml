[project]
name = "careerpilot-api"
version = "0.1.0"
description = "CareerPilot AI - API and background worker (modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "celery>=5.4,<6",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "anthropic>=0.70",
    "boto3>=1.35",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pypdfium2>=4.30"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["careerpilot"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF012",
    "N818",   # domain exception names (NotFound, Forbidden) read better without an Error suffix
    "RUF001", # en/em dashes are intentional in date-range regexes
    "UP046",  # Generic[T] kept for Pydantic compatibility
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "postgres: requires a real PostgreSQL+pgvector database (TEST_DATABASE_URL)",
    "real_provider: calls a real external AI provider (costs money; opt-in)",
]
