name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: careerpilot
          POSTGRES_PASSWORD: careerpilot
          POSTGRES_DB: careerpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careerpilot" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy careerpilot
      - name: Tests (SQLite, mock AI)
        run: uv run pytest
      - name: Migrations apply cleanly and match models
        env:
          DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@127.0.0.1:5432/careerpilot_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests (PostgreSQL + pgvector)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://careerpilot:careerpilot@127.0.0.1:5432/careerpilot_test
        run: uv run pytest
      - name: Dependency audit
        run: uvx pip-audit==2.9.0 --strict -r <(uv export --frozen --no-dev --no-hashes)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t careerpilot-api services/api
      - run: docker build -t careerpilot-web apps/web
